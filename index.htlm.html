<!DOCTYPE html>
<html lang="uk">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Реєстрація на TechConf 2026</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <main class="container">
    <!-- Медіа-блок з боку форми -->
    <figure class="event-banner">
      <svg class="banner-svg" viewBox="0 0 400 300" aria-hidden="true" xmlns="http://www.w3.org/2000/svg">
        <defs>
          <linearGradient id="grad" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" style="stop-color:#2563eb;stop-opacity:1" />
            <stop offset="100%" style="stop-color:#1e40af;stop-opacity:1" />
          </linearGradient>
        </defs>
        <rect width="100%" height="100%" rx="16" fill="url(#grad)" />
        <circle cx="200" cy="120" r="60" fill="rgba(255,255,255,0.15)" />
        <path d="M160 210 L240 210 L200 140 Z" fill="rgba(255,255,255,0.3)" />
        <text x="50%" y="80%" dominant-baseline="middle" text-anchor="middle" fill="#ffffff" font-family="sans-serif" font-size="20" font-weight="bold">TechConf 2026</text>
      </svg>
      <figcaption class="visually-hidden">Банер IT-конференції TechConf 2026</figcaption>
    </figure>

    <!-- Основна форма реєстрації -->
    <form class="registration-form" action="#" method="POST" enctype="multipart/form-data">
      <header class="form-header">
        <h2>Реєстрація на воркшоп</h2>
        <p>Заповніть дані для участі у головній IT-події року</p>
      </header>

      <!-- Поле імені -->
      <div class="form-group">
        <label for="full-name">Повне ім'я <span class="required">*</span></label>
        <input 
          type="text" 
          id="full-name" 
          name="full_name" 
          placeholder="Олександр Коваленко" 
          required 
          minlength="2"
        >
        <span class="error-msg">Будь ласка, вкажіть ім'я (не менше 2 символів)</span>
      </div>

      <!-- Поле email -->
      <div class="form-group">
        <label for="email">Електронна пошта <span class="required">*</span></label>
        <input 
          type="email" 
          id="email" 
          name="email" 
          placeholder="alex@example.com" 
          required
        >
        <span class="error-msg">Введіть коректну e-mail адресу</span>
      </div>

      <!-- Вибір секції -->
      <div class="form-group">
        <label for="section">Обрати секцію <span class="required">*</span></label>
        <select id="section" name="section" required>
          <option value="" disabled selected>Оберіть напрямок...</option>
          <option value="frontend">Frontend & CSS Architecture</option>
          <option value="backend">Backend & Distributed Systems</option>
          <option value="ai-ml">AI & Machine Learning</option>
        </select>
        <span class="error-msg">Будь ласка, оберіть секцію</span>
      </div>

      <!-- Завантаження файлу (аватар) -->
      <div class="form-group">
        <label for="avatar">Аватар або резюме (PNG, JPG, PDF)</label>
        <input 
          type="file" 
          id="avatar" 
          name="avatar" 
          accept=".jpg,.jpeg,.png,.pdf"
        >
      </div>

      <!-- Чекбокс згоди -->
      <div class="form-group checkbox-group">
        <label class="checkbox-label" for="terms">
          <input type="checkbox" id="terms" name="terms" required>
          <span>Я погоджуюся з правилами проведення та обробкою даних <span class="required">*</span></span>
        </label>
      </div>

      <!-- Кнопка відправки -->
      <div class="form-actions">
        <button type="submit" class="btn-primary">Зареєструватися</button>
      </div>
    </form>
  </main>

</body>
</html>
